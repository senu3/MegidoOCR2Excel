[project]
name = "megidoocr2excel"
version = "0.1.0"
description = "OCR template tool for extracting fixed novel-game screenshots to Excel."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "openpyxl>=3.1.0",
    "paddleocr>=3.7.0,<4",
    "paddlepaddle>=3.3.1,<4",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
tesseract = [
    "pytesseract>=0.3.10",
]

[project.scripts]
megido-ocr-to-excel = "megido_ocr_excel.application:main"

[dependency-groups]
dev = [
    "zuban==0.9.0",
]

[tool.uv]
package = false

[tool.zuban]
mode = "default"
files = [
    "main.py",
    "launcher.py",
    "megido_ocr_excel",
    "scripts",
]
