name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MEGIDO_RUN_PRIVATE_SAMPLE_TESTS: "0"
      PYTHONUTF8: "1"
      UV_NO_PROGRESS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Verify lock file
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Compile Python sources
        run: uv run python -m compileall -q main.py launcher.py megido_ocr_excel scripts tests

      - name: Run self-contained tests
        run: uv run python -m unittest discover -s tests

      - name: Validate release package
        run: uv run python scripts/build_release.py --output-dir dist

      - name: Confirm build did not modify sources
        run: git diff --exit-code
